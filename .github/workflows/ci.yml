name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Движок и ИИ (swift test)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Версии
        run: |
          xcodebuild -version
          swift --version
      - name: Тесты
        working-directory: DebercKit
        run: swift test

  app:
    name: Приложение iOS
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Версия Xcode
        run: xcodebuild -version

      # То же, что делает workflow TestFlight, только без подписи и загрузки.
      - name: Архив для устройства (Release, без подписи)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project Deberc.xcodeproj -scheme Deberc -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Deberc.xcarchive \
            -derivedDataPath build/DerivedData-device \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee build/device.log | grep -E "error:|warning:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" build/device.log
          APP=build/Deberc.xcarchive/Products/Applications/Deberc.app
          echo "Info.plist сборки:"
          plutil -p "$APP/Info.plist" | grep -E "CFBundle(DisplayName|Identifier|ShortVersionString|Version)|ITSAppUses|UISupported|MinimumOS" || true
          test -f "$APP/PrivacyInfo.xcprivacy" && echo "PrivacyInfo.xcprivacy: есть"
          test -f "$APP/Assets.car" && echo "Assets.car: есть"

      - name: Сборка для симулятора
        run: |
          set -o pipefail
          xcodebuild -project Deberc.xcodeproj -scheme Deberc -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/simulator.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build/simulator.log

      - name: Проверка на симуляторе iPhone
        run: |
          chmod +x scripts/simulator-smoke-test.sh
          scripts/simulator-smoke-test.sh build/DerivedData/Build/Products/Debug-iphonesimulator/Deberc.app iphone build/screenshots

      - name: Проверка на симуляторе iPad
        run: |
          scripts/simulator-smoke-test.sh build/DerivedData/Build/Products/Debug-iphonesimulator/Deberc.app ipad build/screenshots

      - name: Скриншоты и логи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-and-logs
          path: |
            build/screenshots
            build/*.log
          if-no-files-found: ignore
