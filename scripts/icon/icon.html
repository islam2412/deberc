<!doctype html>
<!--
  Исходник иконки «Деберц» (1024×1024). Три варианта для Assets.xcassets/AppIcon.appiconset:
  body.any — обычная (сукно, без прозрачности), body.dark — тёмная (прозрачный фон,
  iOS 18+ подкладывает свой), body.tinted — тонированная (оттенки серого на чёрном, без прозрачности).
  Перерисовать: node scripts/icon/render-icons.js (нужен Playwright). Шрифты — DejaVu,
  как при первой отрисовке; на другой машине подставьте их или Georgia/Arial.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Иконка Деберц</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1024px; height: 1024px; overflow: hidden;
    background: radial-gradient(circle at 50% 42%, #1f8a4c 0%, #146b39 38%, #0a3f22 78%, #062a16 100%);
    font-family: "DejaVu Serif", Georgia, serif;
    position: relative;
  }
  .felt {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,0.018) 0 6px, rgba(0,0,0,0.018) 6px 12px);
  }
  .card {
    position: absolute;
    width: 430px; height: 620px;
    border-radius: 44px;
    background: linear-gradient(160deg, #ffffff 0%, #f7f3ea 100%);
    box-shadow: 0 26px 60px rgba(0,0,0,0.45), 0 4px 10px rgba(0,0,0,0.3);
    left: 50%; top: 50%;
  }
  .back {
    transform: translate(-72%, -52%) rotate(-14deg);
  }
  .front {
    transform: translate(-30%, -46%) rotate(9deg);
  }
  .corner {
    position: absolute; left: 34px; top: 26px;
    color: #c8102e; text-align: center; line-height: 0.92;
    font-weight: bold;
  }
  .corner .r { font-size: 96px; font-family: "DejaVu Sans", Arial, sans-serif; }
  .corner .s { font-size: 80px; font-family: "DejaVu Sans", Arial, sans-serif; }
  .corner.br { left: auto; top: auto; right: 34px; bottom: 26px; transform: rotate(180deg); }
  .center {
    position: absolute; left: 0; right: 0; top: 50%;
    transform: translateY(-50%);
    text-align: center; color: #c8102e;
  }
  .center .big { font-size: 300px; line-height: 1; font-weight: bold; }
  .center .suit { font-size: 150px; line-height: 1; font-family: "DejaVu Sans", Arial, sans-serif; margin-top: -10px; }
  .frame {
    position: absolute; left: 92px; right: 92px; top: 150px; bottom: 150px;
    border: 5px solid rgba(200,16,46,0.28); border-radius: 26px;
  }
  .nine .center .suit { font-size: 260px; margin-top: 0; }

  /* ---------- Тёмный вариант (iOS 18+): прозрачный фон, система подложит свой тёмный. ---------- */
  body.dark { background: transparent; }
  body.dark .felt { display: none; }
  body.dark .card {
    background: linear-gradient(160deg, #1f5a3b 0%, #123524 100%);
    box-shadow: 0 26px 60px rgba(0,0,0,0.55), 0 4px 10px rgba(0,0,0,0.35), inset 0 0 0 5px rgba(255,255,255,0.16);
  }
  body.dark .corner, body.dark .center { color: #ff6b78; }
  body.dark .frame { border-color: rgba(255,91,107,0.35); }

  /* ---------- Тонированный вариант: оттенки серого на чёрном, без прозрачности. ---------- */
  body.tinted { background: #000; }
  body.tinted .felt { display: none; }
  body.tinted .card { background: #d8d8d8; box-shadow: 0 26px 60px rgba(0,0,0,0.9); }
  body.tinted .card.back { background: #8e8e8e; }
  body.tinted .corner, body.tinted .center { color: #000; }
  body.tinted .card.back .corner, body.tinted .card.back .center { color: #1a1a1a; }
  body.tinted .frame { border-color: rgba(0,0,0,0.45); }
</style>
</head>
<body class="any">
  <div class="felt"></div>
  <div class="card back nine">
    <div class="corner"><div class="r">9</div><div class="s">♥&#xFE0E;</div></div>
    <div class="center"><div class="suit">♥&#xFE0E;</div></div>
    <div class="corner br"><div class="r">9</div><div class="s">♥&#xFE0E;</div></div>
  </div>
  <div class="card front">
    <div class="frame"></div>
    <div class="corner"><div class="r">В</div><div class="s">♥&#xFE0E;</div></div>
    <div class="center"><div class="big">В</div><div class="suit">♥&#xFE0E;</div></div>
    <div class="corner br"><div class="r">В</div><div class="s">♥&#xFE0E;</div></div>
  </div>
</body>
</html>
